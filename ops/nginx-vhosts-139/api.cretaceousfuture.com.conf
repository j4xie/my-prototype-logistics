server
{
    listen 80;
    server_name api.cretaceousfuture.com;
    return 301 https://$host$request_uri;
}

server
{
    listen 443 ssl;
    http2 on;
    server_name api.cretaceousfuture.com;

    #SSL
    ssl_certificate    /www/server/panel/vhost/cert/api.cretaceousfuture.com.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/api.cretaceousfuture.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ============================================================
    # Scanner/probe blocklist - return 444 (no response) for known
    # attack reconnaissance patterns. Added 2026-04-10 to stop probes
    # (/.git/config, /wp-admin, /.env, etc.) from reaching the Cretas
    # Java backend. Real API paths go through location / below.
    # ============================================================
    location ~* \.(git|svn|hg|bzr)(/|$) { return 444; }
    location ~* /\.env { return 444; }
    location ~* /wp-(admin|content|includes|login) { return 444; }
    location ~* /(phpmyadmin|phpMyAdmin|pma|myadmin) { return 444; }
    location ~* /(config|settings)\.(php|yml|yaml|json|ini)$ { return 444; }
    location ~* /(ads|app-ads|sellers)\.txt$ { return 444; }
    location ~* /(wiki|xmlrpc\.php|wp-config\.php|\.DS_Store) { return 444; }
    location = /favicon.ico { log_not_found off; access_log off; return 204; }


    # ============================================================
    # T6.3 cutover (2026-05-08): 61 test factories SmartBI traffic to Python (port 8083)
    # Other factories + non-SmartBI paths still hit Java via location / below.
    # Backup: api.cretaceousfuture.com.conf.bak.t6_3_pre.20260508_032339
    # Rollback: cp <backup> api.cretaceousfuture.com.conf && nginx -s reload
    # Per runbook $3.2 (docs/superpowers/specs/2026-05-02-phase2a-t6-deploy-runbook.md)
    # ============================================================
    location ~ ^/api/mobile/(F00[1-46]|FOOD_3101_(00[1-9]|0[1-3][0-9]|04[0-8])|MEAT_3101_00[12]|OTHER_3101_001|RES_3101_00[1-9]|RES_GML_001|R001|R_(GML_DEMO|XMX_(CHAIN|FRESH[123]?)|YHDJ_DEMO|YJJ_DEMO)|TEST_0000_001)/smart-bi/(alerts|recommendations|data-date-range)$ {
        proxy_pass http://cretas_python;
        include /www/server/panel/vhost/nginx/include/cretas-python-proxy-defaults.conf;
    }
    location ~ ^/api/mobile/(F00[1-46]|FOOD_3101_(00[1-9]|0[1-3][0-9]|04[0-8])|MEAT_3101_00[12]|OTHER_3101_001|RES_3101_00[1-9]|RES_GML_001|R001|R_(GML_DEMO|XMX_(CHAIN|FRESH[123]?)|YHDJ_DEMO|YJJ_DEMO)|TEST_0000_001)/smart-bi/analysis/(finance|sales|department|region|inventory|procurement)(/.*)?$ {
        proxy_pass http://cretas_python;
        include /www/server/panel/vhost/nginx/include/cretas-python-proxy-defaults.conf;
    }
    location ~ ^/api/mobile/(F00[1-46]|FOOD_3101_(00[1-9]|0[1-3][0-9]|04[0-8])|MEAT_3101_00[12]|OTHER_3101_001|RES_3101_00[1-9]|RES_GML_001|R001|R_(GML_DEMO|XMX_(CHAIN|FRESH[123]?)|YHDJ_DEMO|YJJ_DEMO)|TEST_0000_001)/smart-bi/(query-templates|datasource|incentive-plan)(/.*)?$ {
        proxy_pass http://cretas_python;
        include /www/server/panel/vhost/nginx/include/cretas-python-proxy-defaults.conf;
    }

    # T6.6.3a canary (2026-05-14): R_ILTEATRO_REAL only → Python for /analysis/(production|quality).
    # Per spec docs/superpowers/specs/2026-05-11-t6-6-cutover-spec.md §3.3 + §4.2 (explicit
    # single-tenant whitelist for canary stage). Factory tenants + other restaurants fall
    # through to location / catch-all (Java) — unchanged.
    # Rollback: cp api.cretaceousfuture.com.conf.bak.t6-6-3a.<ts> api.cretaceousfuture.com.conf && nginx -t && nginx -s reload
    location ~ ^/api/mobile/R_ILTEATRO_REAL/smart-bi/analysis/(production|quality)(/.*)?$ {
        proxy_pass http://cretas_python;
        include /www/server/panel/vhost/nginx/include/cretas-python-proxy-defaults.conf;
    }

    # Proxy all requests to Java backend on 47
    location / {
        proxy_pass http://cretas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;

        # SSE support
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;

        # CORS
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin '*';
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With';
            add_header Content-Length 0;
            return 204;
        }
    }

    access_log /www/wwwlogs/api.cretaceousfuture.com.log;
    error_log /www/wwwlogs/api.cretaceousfuture.com.error.log;
}

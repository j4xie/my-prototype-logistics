server
{
    listen 80;
    server_name api.cretaceousfuture.com;
    return 301 https://$host$request_uri;
}

server
{
    listen 443 ssl;
    http2 on;
    server_name api.cretaceousfuture.com;

    #SSL
    ssl_certificate    /www/server/panel/vhost/cert/api.cretaceousfuture.com.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/api.cretaceousfuture.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ============================================================
    # Scanner/probe blocklist - return 444 (no response) for known
    # attack reconnaissance patterns. Added 2026-04-10 to stop probes
    # (/.git/config, /wp-admin, /.env, etc.) from reaching the Cretas
    # Java backend. Real API paths go through location / below.
    # ============================================================
    location ~* \.(git|svn|hg|bzr)(/|$) { return 444; }
    location ~* /\.env { return 444; }
    location ~* /wp-(admin|content|includes|login) { return 444; }
    location ~* /(phpmyadmin|phpMyAdmin|pma|myadmin) { return 444; }
    location ~* /(config|settings)\.(php|yml|yaml|json|ini)$ { return 444; }
    location ~* /(ads|app-ads|sellers)\.txt$ { return 444; }
    location ~* /(wiki|xmlrpc\.php|wp-config\.php|\.DS_Store) { return 444; }
    location = /favicon.ico { log_not_found off; access_log off; return 204; }

    # SmartBI Python routing — shared across 3 vhosts (snippets/smart-bi-routing.conf)
    include /www/server/nginx/conf/snippets/smart-bi-routing.conf;

    # Proxy all requests to Java backend on 47
    location / {
        proxy_pass http://cretas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;

        # SSE support
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;

        # CORS
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin '*';
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With';
            add_header Content-Length 0;
            return 204;
        }
    }

    access_log /www/wwwlogs/api.cretaceousfuture.com.log;
    error_log /www/wwwlogs/api.cretaceousfuture.com.error.log;
}

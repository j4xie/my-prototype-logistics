server {
    listen 8097;
    server_name _;
    root /www/wwwroot/web-admin-test;
    index index.html;

    # HTML - no cache (always get latest)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Static assets with content hash -- 1 year cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # =====================================================
    # Client Requirement Wizard (onboarding page)
    # =====================================================
    location ^~ /onboarding/ {
        alias /www/wwwroot/client-request/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # Client Requirement API proxy (public)
    location /api/public/client-requirement/ {
        charset utf-8;
        proxy_pass http://47.100.235.168:8084/api/public/client-requirement/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $http_content_type;
        proxy_buffering off;
    }

    # SSE streaming for AI Chat (Python service via smartbi-api)
    location ~ ^/smartbi-api/api/chat/.*-stream$ {
        proxy_pass http://47.100.235.168:8084;
        rewrite ^/smartbi-api(/.*)$ $1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    # Python SmartBI API proxy (via /smartbi-api prefix from frontend)
    location /smartbi-api/ {
        proxy_pass http://47.100.235.168:8084/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 900s;
        client_max_body_size 500m;
    }

    # Python SmartBI API proxy (direct path)
    location /api/smartbi/ {
        proxy_pass http://47.100.235.168:8084/api/smartbi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 900s;
        client_max_body_size 500m;
    }

    # SSE streaming endpoint -- disable buffering for real-time events
    # Phase 9 Apr 24: SSE streaming for LLM insights
    location ~ /api/mobile/.*/smart-bi/dashboard/executive/insights/custom/stream {
        proxy_pass http://cretas_backend_test;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ /api/mobile/.*/smart-bi/upload-batch-stream {
        proxy_pass http://cretas_backend_test;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    # Phase 2A SmartBI (BUG-R1B-01 / PR #441): route smart-bi/analysis/* for cutover
    # factories to Python test 8084. Java handlers deleted in T6.5 Phase A->C (May 9,
    # PR #205/#236). Mirror prod nginx api.cretaceousfuture.com.conf:50 factory regex.
    location ~ ^/api/mobile/(F00[1-46]|FOOD_3101_(00[1-9]|0[1-3][0-9]|04[0-8])|MEAT_3101_00[12]|OTHER_3101_001|RES_3101_00[1-9]|RES_GML_001|R001|R_(GML_DEMO|XMX_(CHAIN|FRESH[123]?)|YHDJ_DEMO|YJJ_DEMO)|TEST_0000_001)/smart-bi/analysis/(finance|sales|department|region|inventory|procurement)(/.*)?$ {
        proxy_pass http://47.100.235.168:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 900s;
        client_max_body_size 500m;
    }

    # Public API proxy (no auth needed - share links, etc)
    location /api/public/ {
        proxy_pass http://cretas_backend_test/api/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Java API proxy
    location /api/mobile/ {
        proxy_pass http://cretas_backend_test/api/mobile/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 900s;
        client_max_body_size 500m;
    }
location /api/platform/ {        proxy_pass http://cretas_backend_test/api/platform/;        proxy_set_header Host $host;        proxy_set_header X-Real-IP $remote_addr;        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;        proxy_set_header X-Forwarded-Proto $scheme;    }


    # Browser console error collector
    location = /api/console-report {
        access_log /www/wwwlogs/web-admin-console.log;
        client_body_buffer_size 16k;
        client_max_body_size 16k;
        return 204;
    }
location /api/admin/ {        proxy_pass http://cretas_backend_test/api/admin/;        proxy_set_header Host $host;        proxy_set_header X-Real-IP $remote_addr;        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;        proxy_set_header X-Forwarded-Proto $scheme;    }

    # Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    access_log /www/wwwlogs/web-admin.log;
    error_log /www/wwwlogs/web-admin.error.log;
}

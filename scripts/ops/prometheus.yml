global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'cretas-java-prod'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:10012']

  - job_name: 'cretas-python-prod'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:8083']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

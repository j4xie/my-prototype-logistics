# Cretas nginx scanner blocklist
# ================================
# Applied on 139.196.165.140 in /www/server/panel/vhost/nginx/api.cretaceousfuture.com.conf
# Inserted inside the `server { listen 443 ssl; ... }` block, right before
# the `location /` catch-all that proxies to the cretas_backend upstream.
#
# Return 444 (no response, close connection) for known attack reconnaissance
# patterns. Favicon special-cased to return 204 with logging off so legitimate
# browser requests are quiet without counting as attacks.
#
# Added 2026-04-10 as Phase 2 of the error-log-hygiene rollout
# (see docs/superpowers/plans/2026-04-10-error-log-hygiene-multilayer.md).
#
# Context: Today (2026-04-10) this vhost is NXDOMAIN and not publicly
# reachable — the blocklist is defense-in-depth ready for Phase 3
# cutover when DNS is published and clients migrate off direct-IP access.
# Phase 1 (Spring GlobalExceptionHandler) already handles scanner noise
# at the Java layer for direct-IP scanner traffic.
#
# To re-apply after a Baota-triggered config regenerate:
#   1. SSH root@139.196.165.140
#   2. Open /www/server/panel/vhost/nginx/api.cretaceousfuture.com.conf
#   3. Paste this block after the `server_name` directive in the 443 block,
#      before any `location /` directive
#   4. nginx -t && nginx -s reload

    # ============================================================
    # Scanner/probe blocklist - return 444 (no response) for known
    # attack reconnaissance patterns.
    # ============================================================
    location ~* \.(git|svn|hg|bzr)(/|$) { return 444; }
    location ~* /\.env { return 444; }
    location ~* /wp-(admin|content|includes|login) { return 444; }
    location ~* /(phpmyadmin|phpMyAdmin|pma|myadmin) { return 444; }
    location ~* /(config|settings)\.(php|yml|yaml|json|ini)$ { return 444; }
    location ~* /(ads|app-ads|sellers)\.txt$ { return 444; }
    location ~* /(wiki|xmlrpc\.php|wp-config\.php|\.DS_Store) { return 444; }
    location = /favicon.ico { log_not_found off; access_log off; return 204; }

appId: com.cretas.foodtrace
---
# P2.11 Mobile Smoke — minimal sanity check
# Goal: verify APK boots, login works, home renders, 1 module loads.
# Run: `maestro test e2e/smoke-p2-11.yaml`
# Env: APK built from .env.local pointing at 139:8097 test env.

- launchApp:
    clearState: true
    appId: com.cretas.foodtrace

- waitForAnimationToEnd:
    timeout: 30000

# Dismiss any system dialogs
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Land page
- extendedWaitUntil:
    visible: "Login"
    timeout: 30000
- takeScreenshot: "smoke-01-landing"
- tapOn:
    text: "Login"
    retryTapIfNoChange: true

# Login form
- extendedWaitUntil:
    visible:
      id: "login-username-input"
    timeout: 10000
- tapOn:
    id: "login-username-input"
- eraseText: 50
- inputText: "factory_admin1"
- tapOn:
    id: "login-password-input"
- eraseText: 50
- inputText: "123456"
- pressKey: back
- tapOn:
    id: "login-submit-btn"

# Login success
- extendedWaitUntil:
    visible: "登录成功"
    timeout: 30000
- tapOn:
    text: "OK"
- waitForAnimationToEnd:
    timeout: 8000

# Home
- extendedWaitUntil:
    visible: "快捷操作"
    timeout: 20000
- takeScreenshot: "smoke-02-home"

# Tap one module to verify navigation + network
- tapOn:
    id: "quick-action-hours"
    optional: true
- tapOn:
    text: "生产工时上报"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "smoke-03-module"

# Back home
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "smoke-04-back-home"

# PASS — screenshots in ~/.maestro/tests/<run-id>/

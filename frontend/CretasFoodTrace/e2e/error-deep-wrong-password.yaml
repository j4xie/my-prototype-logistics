appId: com.cretas.foodtrace
---
# RN error-deep: 错密码登录 → 验证 toast 文案 = 后端 message (Rule 7 四位一体)
# 前置: emulator 启动, APK 安装, SSH tunnel :10010 → 47:10011 (test env Java)

- launchApp:
    clearState: true
    appId: com.cretas.foodtrace

- waitForAnimationToEnd:
    timeout: 30000

- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

- extendedWaitUntil:
    visible: "Login"
    timeout: 30000
- tapOn:
    text: "Login"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible:
      id: "login-username-input"
    timeout: 10000

# 1. 空用户名 + 空密码 submit → 前端 validation OR 后端 400
- takeScreenshot: "error-01-empty-form"
- tapOn:
    id: "login-submit-btn"
- takeScreenshot: "error-02-empty-submit-result"
- waitForAnimationToEnd:
    timeout: 3000

# 2. 正确用户名 + 错密码 submit → 后端 401 + toast 文案
- tapOn:
    id: "login-username-input"
- eraseText: 50
- inputText: "factory_admin1"
- tapOn:
    id: "login-password-input"
- eraseText: 50
- inputText: "wrong_password_123"
- pressKey: back
- takeScreenshot: "error-03-wrong-pwd-filled"
- tapOn:
    id: "login-submit-btn"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "error-04-wrong-pwd-response"

# 3. 不存在用户名 submit → 后端 400/404 + toast 文案
- tapOn:
    id: "login-username-input"
- eraseText: 50
- inputText: "nonexistent_user_999"
- tapOn:
    id: "login-password-input"
- eraseText: 50
- inputText: "123456"
- pressKey: back
- tapOn:
    id: "login-submit-btn"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "error-05-nonexistent-user-response"

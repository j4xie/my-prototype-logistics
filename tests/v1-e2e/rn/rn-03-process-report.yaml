appId: com.cretas.foodtrace
---
# RN-03: Production Process Report (P0-15 + P1-1)
# V1 E2E — workshop supervisor accesses process reporting
# Tags: @post-deploy @rn
#
# P0-15: 生产报工 mode_1 (默认)
# P1-1: 工人欠退/换岗扫码 (web deferred, RN path verification)
#
# UPGRADED from optional navigation to mandatory assertions per E2E skill rules.

- launchApp:
    clearState: true
- waitForAnimationToEnd

# Login
- runFlow: flows/login.yaml

# Navigate to workshop/production tab — mandatory (no optional:true)
- extendedWaitUntil:
    visible: ".*Workshop.*|.*Report.*|.*Production.*"
    timeout: 10000

# Tap the workshop/production area
- tapOn:
    text: ".*Workshop.*|.*Report.*"
- waitForAnimationToEnd
- takeScreenshot: rn-03-workshop-entered

# Verify we landed on a production-related screen
# Must see either batch list, report form, or empty state — NOT the home dashboard
- assertVisible:
    text: ".*Report.*|.*batch.*|.*Batch.*|.*report.*|.*Process.*|.*暂无.*|.*No.*data.*"
    optional: false
- takeScreenshot: rn-03-report-section

# If there's a batch/task list, verify it renders (table or FlatList)
# If empty, verify the empty state text is shown (not a crash)
- tapOn:
    text: ".*Batch.*|.*batch.*|.*Task.*|.*task.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: rn-03-batch-or-empty

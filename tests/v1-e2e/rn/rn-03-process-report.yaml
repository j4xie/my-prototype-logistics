appId: com.cretas.foodtrace
---
# RN-03: Production Process Report (P0-15 + P1-1)
# V1 E2E — verifies workshop supervisor can access process reporting
# Tags: @post-deploy @rn
#
# P0-15: 生产报工 mode_1 (默认)
# P1-1: 工人欠退/换岗扫码 (web deferred, RN path verification here)

- launchApp:
    clearState: true
- waitForAnimationToEnd

# Login
- runFlow: flows/login.yaml

# Navigate to production/work report tab
- tapOn:
    text: ".*Workshop.*|.*车间.*|.*Production.*|.*生产.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: rn-03-workshop-tab

# Look for work reporting / process reporting section
- tapOn:
    text: ".*Report.*|.*报工.*|.*Process.*|.*工序.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: rn-03-report-section

# Look for batch or task list
- tapOn:
    text: ".*Batch.*|.*批次.*|.*Task.*|.*任务.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: rn-03-batch-list

# Note: actual process reporting requires active production plan + FMR.
# This test verifies the RN navigation path exists.

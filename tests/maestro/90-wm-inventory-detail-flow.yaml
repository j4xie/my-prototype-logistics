appId: com.cretas.foodtrace

---

# Test 90: Warehouse Manager - Complete Inventory Detail Flow

# Full flow: inventory list -> detail (moving avg price) -> batch detail -> back

# Verifies navigation and data consistency across warehouse screens



- launchApp:

    clearState: true

- waitForAnimationToEnd



# Login as warehouse manager

- runFlow: flows/login-wm.yaml

- extendedWaitUntil:

    visible: ".*\u4ED3\u50A8.*|.*\u5E93\u5B58.*|.*Warehouse.*|.*Inventory.*"

    timeout: 15000



# ========================================

# M-01: Navigate to Inventory tab (WM tab: 库存)

# ========================================

- tapOn: "\u5E93\u5B58"

- waitForAnimationToEnd



- extendedWaitUntil:

    visible: ".*\u5E93\u5B58.*|.*Inventory.*"

    timeout: 15000

- takeScreenshot: screenshots/90-inventory-list



# ========================================

# M-02: Tap first inventory item

# ========================================

- tapOn:

    text: ".*\u67E5\u770B\u8BE6\u60C5.*|.*View Detail.*"

    optional: true

- waitForAnimationToEnd



- extendedWaitUntil:

    visible: ".*\u5E93\u5B58\u8BE6\u60C5.*|.*Inventory Detail.*"

    timeout: 15000



# ========================================

# M-03: Verify detail loads with material info

# ========================================

- assertVisible:

    text: ".*\u57FA\u672C\u4FE1\u606F.*"

    optional: true



- assertVisible:

    text: ".*\u5B89\u5168\u5E93\u5B58.*"

    optional: true



- takeScreenshot: screenshots/90-inventory-detail



# ========================================

# M-04: Verify moving average price field

# ========================================

- scrollUntilVisible:

    element:

      text: "\u79FB\u52A8\u5747\u4EF7"

    direction: DOWN

    timeout: 10000



- assertVisible:

    id: "moving-avg-price"



- assertVisible:

    text: "\u79FB\u52A8\u5747\u4EF7"



- takeScreenshot: screenshots/90-inventory-moving-avg



# ========================================

# M-05: Navigate to batch detail

# ========================================

- scrollUntilVisible:

    element:

      text: ".*\u6279\u6B21.*|.*MB-.*"

    direction: DOWN

    timeout: 10000



# Tap first batch in the list

- tapOn:

    text: ".*\u67E5\u770B\u8BE6\u60C5.*"

    optional: true

- waitForAnimationToEnd



# ========================================

# M-06: Verify batch detail with moving avg price

# ========================================

- extendedWaitUntil:

    visible: ".*\u6279\u6B21\u8BE6\u60C5.*|.*Batch Detail.*"

    timeout: 15000



# Scroll to find moving avg price in batch detail

- scrollUntilVisible:

    element:

      text: "\u79FB\u52A8\u5747\u4EF7"

    direction: DOWN

    timeout: 10000



- assertVisible:

    id: "moving-avg-price"



- takeScreenshot: screenshots/90-batch-detail



# ========================================

# M-07: Verify AI quality analysis section

# ========================================

- scrollUntilVisible:

    element:

      text: ".*AI.*|.*\u8D28\u91CF.*|.*\u5173\u8054\u5206\u6790.*"

    direction: DOWN

    timeout: 10000



- takeScreenshot: screenshots/90-batch-ai-analysis



# ========================================

# M-08: Go back twice to inventory list

# ========================================

- back

- waitForAnimationToEnd



- back

- waitForAnimationToEnd



- extendedWaitUntil:

    visible: ".*\u5E93\u5B58.*|.*Inventory.*"

    timeout: 15000



- takeScreenshot: screenshots/90-inventory-list-return


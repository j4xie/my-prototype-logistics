appId: com.cretas.foodtrace

---

# Test 86: Workshop Supervisor - Scan Report TestID Verification

# Verifies all key testIDs are present on ScanReportScreen

# Covers: scan-report-screen, report-output-quantity, report-input-quantity,

#         report-good-quantity, report-submit-btn

# NOTE: ScanReport is only accessible via WS (批次 tab), not FA



- launchApp:

    clearState: true

- waitForAnimationToEnd



# Login as workshop supervisor (has ScanReport access via 批次 tab)

- runFlow: flows/login-ws.yaml

- extendedWaitUntil:

    visible: "Start Task"

    timeout: 15000



# ========================================

# M-01: Navigate to Batches tab (WS tab: 批次)

# ========================================

- tapOn:

    text: "\u6279\u6B21"

- waitForAnimationToEnd



- extendedWaitUntil:

    visible: ".*\u6279\u6B21.*|.*Batch.*"

    timeout: 15000



# ========================================

# M-02: Navigate to Scan Report Screen

# ========================================

- scrollUntilVisible:

    element:

      text: ".*\u626B\u7801\u62A5\u5DE5.*|.*Scan Report.*"

    direction: DOWN

    timeout: 10000



- tapOn:

    text: ".*\u626B\u7801\u62A5\u5DE5.*|.*Scan Report.*"

    optional: true



# ========================================

# M-03: Verify scan-report-screen testID

# ========================================

- extendedWaitUntil:

    visible:

      id: "scan-report-screen"

    timeout: 15000



- assertVisible:

    id: "scan-report-screen"



- takeScreenshot: screenshots/86-scan-report-screen



# ========================================

# M-04: Verify scan button

# ========================================

- assertVisible:

    id: "scan-button"

    optional: true



- assertVisible:

    text: ".*\u626B\u7801\u62A5\u5DE5.*|.*\u5F00\u59CB\u626B\u7801.*"



# ========================================

# M-05: Verify form structure

# ========================================

# The form fields appear only after a batch is scanned.

# We verify the screen container and scan prompt are present.

- assertVisible:

    text: ".*\u626B\u63CF\u6279\u6B21\u6761\u7801.*|.*\u5F00\u59CB\u62A5\u5DE5.*"

    optional: true



- takeScreenshot: screenshots/86-scan-report-testids



# ========================================

# M-06: Verify submit button exists (after scan)

# ========================================

# report-submit-btn only appears when batch info is loaded

# We verify the overall screen structure is intact

- assertVisible:

    id: "scan-report-screen"



- takeScreenshot: screenshots/86-scan-report-verified


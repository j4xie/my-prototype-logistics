# ============================================================
# OTA self-hosted Expo Updates server — independent subdomain.
#
# Why a separate vhost (not piggy-backing on api.cretaceousfuture.com):
# 1. URL is baked into the APK forever — coupling OTA to the main API
#    domain locks the two together for the life of every customer install.
# 2. Failure-domain isolation — if the main API has trouble (timeouts,
#    JWT middleware bug, rate-limit storms), OTA stays reachable so we
#    can still ship a rollback bundle. That's the whole point of OTA.
# 3. Semantic — OTA is static-resource distribution (closer to a CDN),
#    not business API. Putting it under api.* is misleading.
# 4. Future-proof — switching OTA to OSS/CDN later = one DNS change,
#    api.* stays untouched.
#
# Cert was acquired 2026-05-12 via acme.sh DNS-01 against alidns
# (Let's Encrypt ECC, 90-day auto-renew via acme.sh cron).
#
# Live config lives at /www/server/panel/vhost/nginx/ota.cretaceousfuture.com.conf
# on server 139. Apply via: ./scripts/ota/install-nginx-ota.sh
# ============================================================

server {
    listen 80;
    server_name ota.cretaceousfuture.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ota.cretaceousfuture.com;

    # SSL — Let's Encrypt ECC via acme.sh
    ssl_certificate     /www/server/panel/vhost/cert/ota.cretaceousfuture.com.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ota.cretaceousfuture.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Block scanner / probe noise just like the api vhost does.
    location ~* \.(git|svn|hg|bzr)(/|$) { return 444; }
    location ~* /\.env { return 444; }
    location = /favicon.ico { log_not_found off; access_log off; return 204; }

    # Everything under /api/ota/ → cretas_python upstream on 47:8083.
    # We keep the /api/ota/ prefix (no path rewrite) so the Python router
    # registration in main.py doesn't have to change — the manifest URLs
    # emitted by manifest_builder._asset_url stay self-consistent across
    # the nginx hop.
    location /api/ota/ {
        proxy_pass http://cretas_python;
        include /www/server/panel/vhost/nginx/include/cretas-python-proxy-defaults.conf;

        # OTA-specific overrides on top of the shared Python defaults:
        # bundles + assets can run to tens of MB; mobile network downloads
        # may stream slowly.
        client_max_body_size 50M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Catch-all on this vhost returns 404 — OTA endpoints are explicit only.
    # Prevents accidental exposure if someone misroutes a path here.
    location / {
        return 404;
    }
}

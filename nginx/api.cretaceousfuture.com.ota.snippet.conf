# ============================================================
# OTA self-hosted Expo Updates server — added 2026-05-12 (Phase 4 of self-hosted
# OTA roadmap, spec §8). Reverse-proxies /api/ota/* from 139 nginx gateway to
# Python service on 47:8083 (where backend/python/ota/api/endpoints.py lives).
#
# Public paths (/manifest, /assets, /health) served per Expo Updates v1 protocol
# (no JWT — see auth_middleware.PUBLIC_PREFIXES "/api/ota/" exemption added by
# PR #375). Admin paths (/api/ota/admin/*) auth-gated by OTA_ADMIN_TOKEN in
# Python (hmac.compare_digest) — handled in the Python layer, not nginx.
#
# This snippet is COMMITTED for version control. The live config lives at
# /www/server/panel/vhost/nginx/api.cretaceousfuture.com.conf on server 139.
# Apply via: ./scripts/ota/install-nginx-ota.sh
#
# Insertion target: immediately ABOVE the `location /` catch-all in
# api.cretaceousfuture.com.conf so the prefix match takes precedence.
# ============================================================
location /api/ota/ {
    proxy_pass http://cretas_python;
    include /www/server/panel/vhost/nginx/include/cretas-python-proxy-defaults.conf;

    # OTA-specific overrides on top of the shared Python defaults:
    # - Bundles + assets can run to tens of MB (Expo export output)
    # - Asset downloads to constrained mobile networks may stream slowly
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

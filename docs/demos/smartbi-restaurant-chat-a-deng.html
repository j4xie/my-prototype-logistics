<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartBI · 诊断对话 · 鼎鲜火锅义乌店</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e1a;
  --bg-card: #131828;
  --bg-elevated: #1c2238;
  --bg-user: #1e3a5f;
  --line: #2a3048;
  --ink: #e8ecf8;
  --ink-dim: #8890ac;
  --ink-mute: #4a5070;
  --critical: #ff3b5c;
  --warn: #ffb84d;
  --good: #4ade80;
  --accent: #5eead4;
  --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
  --serif: 'Noto Serif SC', 'Songti SC', serif;
  --display: 'Oswald', 'Impact', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  -webkit-font-smoothing: antialiased;
}
body {
  background-image:
    radial-gradient(ellipse 1000px 500px at 30% 0%, rgba(255, 59, 92, 0.06), transparent),
    radial-gradient(ellipse 600px 300px at 100% 100%, rgba(94, 234, 212, 0.04), transparent),
    linear-gradient(180deg, var(--bg) 0%, #050811 100%);
  min-height: 100vh;
}

.app {
  max-width: 880px;
  margin: 0 auto;
  padding: 30px 20px 120px;
  position: relative;
}

/* ========== HEADER ========== */
.header {
  border-top: 4px double var(--critical);
  border-bottom: 1px solid var(--line);
  padding: 20px 0 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-dot {
  width: 10px; height: 10px;
  background: var(--critical);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--critical);
  animation: pulse 1.8s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}
.brand-text {
  font-family: var(--display);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.brand-text em {
  font-style: normal;
  color: var(--critical);
}
.brand-sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-dim);
  letter-spacing: 1px;
  margin-top: 2px;
}
.meta {
  text-align: right;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-dim);
  letter-spacing: 1px;
  line-height: 1.6;
}
.meta strong { color: var(--accent); }

/* ========== SESSION CAPTION ========== */
.session-caption {
  background: var(--bg-card);
  border-left: 3px solid var(--warn);
  padding: 14px 20px;
  margin-bottom: 30px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-dim);
  line-height: 1.7;
  letter-spacing: 0.5px;
}
.session-caption strong { color: var(--warn); }

/* ========== CHAT ========== */
.chat {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.turn {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.turn.visible {
  opacity: 1;
  transform: translateY(0);
}

/* User bubble */
.turn.user {
  display: flex;
  justify-content: flex-end;
}
.bubble-user {
  max-width: 72%;
  background: var(--bg-user);
  border: 1px solid #2d5580;
  border-radius: 14px 14px 4px 14px;
  padding: 14px 18px;
  font-family: var(--serif);
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink);
  position: relative;
}
.bubble-user::after {
  content: "鼎鲜火锅义乌 · 邓总";
  position: absolute;
  bottom: -18px;
  right: 4px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink-mute);
  letter-spacing: 1px;
}

/* AI bubble */
.turn.ai {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.ai-avatar {
  width: 36px; height: 36px;
  border: 1px solid var(--critical);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--display);
  font-size: 14px;
  font-weight: 700;
  color: var(--critical);
  flex-shrink: 0;
  background: var(--bg-card);
  letter-spacing: 0.5px;
}
.bubble-ai {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-left: 3px solid var(--critical);
  border-radius: 4px 14px 14px 14px;
  padding: 18px 22px;
  position: relative;
}
.bubble-ai .ai-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--critical);
  margin-bottom: 10px;
}
.bubble-ai .ai-text {
  font-family: var(--serif);
  font-size: 14px;
  line-height: 1.7;
  color: var(--ink);
}
.bubble-ai .ai-text p { margin-bottom: 8px; }
.bubble-ai .ai-text em { color: var(--warn); font-style: normal; font-weight: 700; }
.bubble-ai .ai-text strong { color: var(--critical); }

/* Typing indicator */
.typing {
  display: flex;
  gap: 12px;
  align-items: center;
  opacity: 0;
  transition: opacity 0.3s;
}
.typing.visible { opacity: 1; }
.typing-bubble {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 20px;
  display: flex;
  gap: 6px;
}
.typing-bubble span {
  width: 7px; height: 7px;
  background: var(--critical);
  border-radius: 50%;
  animation: typing 1.2s infinite;
}
.typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing {
  0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-4px); }
}

/* ========== AI content cards ========== */
.card-block {
  margin-top: 14px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px 18px;
}
.card-block + .card-block { margin-top: 10px; }
.card-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin-bottom: 6px;
}
.card-value {
  font-family: var(--display);
  font-size: 34px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 1px;
}
.card-value.critical { color: var(--critical); }
.card-value.warn { color: var(--warn); }
.card-value.good { color: var(--good); }
.card-delta {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--critical);
  margin-top: 6px;
  letter-spacing: 0.5px;
}
.card-delta.warn { color: var(--warn); }

/* Stats grid */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
.stat-mini {
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  padding: 12px 14px;
  border-radius: 4px;
}
.stat-mini-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink-dim);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.stat-mini-val {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 700;
  line-height: 1.1;
}
.stat-mini-val.critical { color: var(--critical); }
.stat-mini-val.warn { color: var(--warn); }
.stat-mini-val.good { color: var(--good); }
.stat-mini-sub {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink-mute);
  margin-top: 3px;
}

/* Formula block */
.formula {
  margin-top: 12px;
  padding: 12px 16px;
  background: #0a0e1a;
  border: 1px dashed var(--warn);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--warn);
  line-height: 1.7;
}
.formula .arrow { color: var(--ink-dim); margin: 0 8px; }
.formula strong { color: var(--critical); font-weight: 700; }

/* Rx list */
.rx {
  margin-top: 12px;
  counter-reset: rx;
}
.rx-item {
  counter-increment: rx;
  padding: 12px 0 12px 42px;
  border-bottom: 1px dotted var(--line);
  position: relative;
}
.rx-item:last-child { border-bottom: none; }
.rx-item::before {
  content: counter(rx, decimal-leading-zero);
  position: absolute;
  left: 0; top: 12px;
  font-family: var(--display);
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
}
.rx-title {
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 3px;
}
.rx-title em { color: var(--accent); font-style: normal; }
.rx-desc {
  font-family: var(--serif);
  font-size: 12px;
  color: var(--ink-dim);
  line-height: 1.6;
}

/* Bar */
.bar-wrap {
  margin-top: 12px;
}
.bar-label {
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-dim);
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}
.bar-label .burn { color: var(--critical); font-weight: 700; }
.bar-track {
  height: 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--good) 0%, var(--warn) 50%, var(--critical) 100%);
  width: 0;
  transition: width 1.2s ease;
}

/* ========== CONTROLS ========== */
.controls {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 40px;
  padding: 10px 18px;
  display: flex;
  gap: 12px;
  align-items: center;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  z-index: 10;
  backdrop-filter: blur(10px);
}
.ctrl-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 8px 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s;
}
.ctrl-btn:hover {
  border-color: var(--critical);
  color: var(--critical);
}
.ctrl-btn.primary {
  background: var(--critical);
  border-color: var(--critical);
  color: #fff;
}
.ctrl-btn.primary:hover {
  background: #ff5577;
}
.progress {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-dim);
  letter-spacing: 1px;
  padding: 0 8px;
}
.progress strong { color: var(--critical); }

/* End marker */
.end-marker {
  text-align: center;
  padding: 40px 0 20px;
  opacity: 0;
  transition: opacity 0.6s;
}
.end-marker.visible { opacity: 1; }
.end-marker-line {
  display: inline-block;
  padding: 8px 24px;
  border-top: 1px solid var(--critical);
  border-bottom: 1px solid var(--critical);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--critical);
}

/* ===== New modules ===== */
.benchmark-row {
  display: grid;
  grid-template-columns: 92px 1fr 64px;
  gap: 12px;
  align-items: center;
  margin-bottom: 12px;
  font-family: var(--mono);
  font-size: 11px;
}
.benchmark-label { color: var(--ink-dim); letter-spacing: 0.3px; }
.benchmark-bar {
  height: 20px;
  background: var(--bg);
  border: 1px solid var(--line);
  position: relative;
  border-radius: 2px;
  overflow: visible;
}
.benchmark-bar-fill {
  height: 100%;
  transition: width 1s ease;
  border-radius: 1px;
}
.benchmark-bar-fill.good { background: linear-gradient(90deg, #22c55e, var(--good)); }
.benchmark-bar-fill.warn { background: linear-gradient(90deg, #eab308, var(--warn)); }
.benchmark-bar-fill.critical { background: linear-gradient(90deg, #b91c1c, var(--critical)); }
.benchmark-marker {
  position: absolute;
  top: -3px; bottom: -3px;
  width: 2px;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
}
.benchmark-marker::after {
  content: "▼";
  position: absolute;
  top: -10px;
  left: -5px;
  font-size: 9px;
  color: var(--accent);
}
.benchmark-val {
  color: var(--ink);
  font-weight: 700;
  text-align: right;
  font-size: 13px;
}
.benchmark-val.critical { color: var(--critical); }
.benchmark-val.warn { color: var(--warn); }
.benchmark-val.good { color: var(--good); }
.benchmark-note {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink-mute);
  margin-top: 10px;
  letter-spacing: 0.3px;
}

.menu-matrix {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 4px;
  margin-top: 14px;
}
.menu-quad {
  background: var(--bg-elevated);
  padding: 14px 16px 16px;
}
.menu-quad-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--ink-dim);
  margin-bottom: 4px;
  text-transform: uppercase;
}
.menu-quad-title {
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
}
.menu-quad.star .menu-quad-title { color: var(--good); }
.menu-quad.cow .menu-quad-title { color: var(--accent); }
.menu-quad.puzzle .menu-quad-title { color: var(--warn); }
.menu-quad.dog .menu-quad-title { color: var(--critical); }
.menu-quad-items {
  font-family: var(--serif);
  font-size: 12px;
  color: var(--ink-dim);
  line-height: 1.6;
}

.heat-single {
  margin-top: 14px;
  padding: 16px 18px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: 4px;
}
.heat-single-title {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin-bottom: 10px;
}
.heat-single-bar {
  display: grid;
  grid-template-columns: repeat(24, 1fr);
  gap: 2px;
  height: 36px;
  margin-bottom: 4px;
}
.heat-single-cell {
  background: var(--bg);
  border-radius: 1px;
}
.heat-single-hours {
  display: grid;
  grid-template-columns: repeat(24, 1fr);
  gap: 2px;
  font-family: var(--mono);
  font-size: 8px;
  color: var(--ink-mute);
  text-align: center;
}

.forecast-svg {
  width: 100%;
  height: 170px;
  margin-top: 4px;
}

.follow-up {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px dotted var(--line);
}
.follow-up-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
}
.follow-up-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.follow-up-chip {
  font-family: var(--serif);
  font-size: 12px;
  padding: 7px 14px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--bg-elevated);
  color: var(--ink-dim);
  transition: all 0.2s;
}
.follow-up-chip:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--bg);
}

.back-link {
  position: fixed;
  top: 20px;
  left: 20px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-dim);
  text-decoration: none;
  letter-spacing: 1.5px;
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: rgba(19, 24, 40, 0.8);
  backdrop-filter: blur(8px);
  z-index: 20;
  transition: all 0.2s;
}
.back-link:hover {
  color: var(--accent);
  border-color: var(--accent);
}

@media (max-width: 640px) {
  .app { padding: 20px 12px 120px; }
  .bubble-user { max-width: 86%; font-size: 14px; }
  .bubble-ai { padding: 14px 16px; }
  .header { flex-direction: column; gap: 12px; align-items: flex-start; }
  .meta { text-align: left; }
  .stats-grid { grid-template-columns: 1fr; }
  .controls { padding: 8px 12px; gap: 6px; }
  .ctrl-btn { padding: 6px 10px; font-size: 10px; }
}
</style>
</head>
<body>
<a href="index.html" class="back-link">← 返回 Demo 中心</a>
<div class="app">

  <header class="header">
    <div class="brand">
      <div class="brand-dot"></div>
      <div>
        <div class="brand-text">Cretas <em>SmartBI</em> · DIAGNOSTIC CHAT</div>
        <div class="brand-sub">餐饮经营诊断 · 会话回放</div>
      </div>
    </div>
    <div class="meta">
      客户 · <strong>鼎鲜火锅 · 义乌分公司</strong><br>
      周期 · 2026-02 经营数据
    </div>
  </header>

  <div class="session-caption">
    <strong>▸ 会话场景</strong>: 邓总把上个月 POS + 财务数据上传到 SmartBI 后, 直接在聊天框里问诊. 下面是完整回放 &mdash; 共 <strong>9</strong> 轮问答. 点击"自动播放"观看, 或"下一步"手动推进.
  </div>

  <div class="chat" id="chat"></div>

  <div class="end-marker" id="end-marker">
    <span class="end-marker-line">─── 会话结束 · END OF SESSION ───</span>
  </div>

</div>

<div class="controls">
  <button class="ctrl-btn" id="btn-restart">↻ 重播</button>
  <button class="ctrl-btn primary" id="btn-toggle">▶ 自动播放</button>
  <button class="ctrl-btn" id="btn-next">下一步 →</button>
  <span class="progress"><strong id="prog-cur">0</strong> / <span id="prog-total">0</span></span>
</div>

<script>
// ==================== SCRIPT DATA ====================
const turns = [
  {
    role: 'user',
    text: '帮我看看 2 月份店里经营情况, 数据已经传上去了.'
  },
  {
    role: 'ai',
    label: 'OVERVIEW · 总览快报',
    html: `
      <p>邓总, 2 月数据已完成解析. 先说结论 &mdash; <strong>情况不乐观</strong>. 营业额较上月<em>大幅下滑</em>, 但人工成本几乎没跟着降, 造成明显的成本刚性问题.</p>
      <div class="card-block">
        <div class="card-label">2 月营业额</div>
        <div class="card-value critical">¥731,048</div>
        <div class="card-delta">环比 <strong>−47.43%</strong> · 从 ¥1,390,503 近乎腰斩</div>
      </div>
      <div class="stats-grid">
        <div class="stat-mini">
          <div class="stat-mini-label">人工成本</div>
          <div class="stat-mini-val warn">−26.60%</div>
          <div class="stat-mini-sub">从 ¥323,805 → ¥237,660</div>
        </div>
        <div class="stat-mini">
          <div class="stat-mini-label">当月亏损</div>
          <div class="stat-mini-val critical">≈ ¥49,724</div>
          <div class="stat-mini-sub">2 月毛利转负</div>
        </div>
      </div>
    `
  },
  {
    role: 'user',
    text: '为什么会降这么多? 是不是成本没控制好?'
  },
  {
    role: 'ai',
    label: 'DIAGNOSIS · 诊断 #1 · 成本刚性',
    html: `
      <p>核心问题是<strong>成本刚性</strong>. 简单说: 营收掉了 47%, 人工只掉 27%, 两者比值就是成本刚性.</p>
      <div class="formula">
        cost_rigidity = Δ人工 / Δ营收<span class="arrow">=</span>−26.60% / −47.43%<span class="arrow">=</span><strong>0.561</strong>
      </div>

function renderAiTurn(turn, typingNode) {
  typingNode.remove();
  const div = document.createElement('div');
  div.className = 'turn ai';
  div.innerHTML = `

      <div class="ai-text">${turn.html}</div>

  `;
  chat.appendChild(div);
  requestAnimationFrame(() => {
    div.classList.add('visible');
    // animate bar fills if any
    div.querySelectorAll('.bar-fill, .benchmark-bar-fill').forEach(bar => {
      const w = bar.style.width;
      bar.style.width = '0';
      setTimeout(() => bar.style.width = w, 100);
    });
    renderHeatSingle(div);
  });
  scrollToBottom();
}

function renderHeatSingle(node) {
  const bar = node.querySelector('#heat-a-bar');
  const hours = node.querySelector('#heat-a-hours');
  if (!bar || !hours) return;
  // dark theme palette: dim → critical red
  const palette = ['#1c2238', '#2a3048', '#3a3a52', '#5a3848', '#8a3850', '#c0365a', '#ff3b5c', '#ff5577'];
  function intensity(h) {
    let v = 0.05;
    // lunch peak around 12
    const lunchDist = Math.abs(h - 12);
    if (lunchDist < 2.5) v += (1 - lunchDist / 2.5) * 0.55;
    // dinner peak around 19
    const dinnerDist = Math.abs(h - 19);
    if (dinnerDist < 3) v += (1 - dinnerDist / 3) * 0.95;
    // afternoon 14-17 very low (empty window)
    if (h >= 14 && h < 17) v = Math.max(0.04, v * 0.2);
    // late tail
    if (h >= 21 && h < 23) v += 0.06 * (1 - (h - 21) / 2);
    return Math.max(0, Math.min(1, v));
  }
  let barHtml = '', hoursHtml = '';
  for (let h = 0; h < 24; h++) {
    const v = intensity(h);
    const idx = Math.min(palette.length - 1, Math.floor(v * palette.length));
    barHtml += `<div class="heat-single-cell" style="background:${palette[idx]}"></div>`;
    hoursHtml += `<div>${h % 4 === 0 ? String(h).padStart(2, '0') : '&nbsp;'}</div>`;
  }
  bar.innerHTML = barHtml;
  hours.innerHTML = hoursHtml;
}

async function advance() {
  if (idx >= turns.length) {
    endMarker.classList.add('visible');
    stopAuto();
    btnNext.disabled = true;
    btnToggle.disabled = true;
    return;
  }
  const turn = turns[idx];
  idx++;
  progCur.textContent = idx;

  if (turn.role === 'user') {
    renderUserTurn(turn);
  } else {
    const typing = renderTypingIndicator();
    await sleep(900);
    renderAiTurn(turn, typing);
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function autoStep() {
  if (!autoplay) return;
  await advance();
  if (idx >= turns.length) return;
  const nextDelay = turns[idx - 1].role === 'user' ? 600 : 2400;
  autoTimer = setTimeout(autoStep, nextDelay);
}

function startAuto() {
  autoplay = true;
  btnToggle.textContent = '❚❚ 暂停';
  autoStep();
}

function stopAuto() {
  autoplay = false;
  btnToggle.textContent = '▶ 自动播放';
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
}

function clearHint() {
  const hint = chat.querySelector('.start-hint');
  if (hint) hint.remove();
}
function showStartHint() {
  chat.innerHTML = `
    <div class="start-hint" style="text-align: center; padding: 70px 20px;">
      <div style="font-family: var(--display); font-size: 44px; color: var(--critical); margin-bottom: 14px; animation: hint-bob 2s ease-in-out infinite; text-shadow: 0 0 16px var(--critical-glow);">▼</div>
      <div style="font-family: var(--serif); font-size: 16px; color: var(--ink); margin-bottom: 10px;">点击下方 <strong style="color: var(--critical); font-weight: 700;">▶ 自动播放</strong> 开始会话回放</div>
      <div style="font-family: var(--mono); font-size: 10px; color: var(--ink-mute); letter-spacing: 2px;">9 ROUNDS · ≈ 40 SECONDS</div>
    </div>
    <style>@keyframes hint-bob { 0%, 100% { transform: translateY(0); opacity: 0.65; } 50% { transform: translateY(6px); opacity: 1; } }</style>
  `;
}

btnNext.addEventListener('click', () => {
  clearHint();
  stopAuto();
  advance();
});
btnToggle.addEventListener('click', () => {
  clearHint();
  if (autoplay) stopAuto();
  else startAuto();
});
btnRestart.addEventListener('click', () => {
  stopAuto();
  chat.innerHTML = '';
  endMarker.classList.remove('visible');
  idx = 0;
  progCur.textContent = 0;
  btnNext.disabled = false;
  btnToggle.disabled = false;
  showStartHint();
});

showStartHint();
</script>
</body>

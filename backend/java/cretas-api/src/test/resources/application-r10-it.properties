# ==========================================
# R10 Integration Test Profile
# ==========================================
# Local PostgreSQL — used to verify R10 reorder-fields endpoint against real
# JSONB + canvas_dynamic_field table writes (the C3 code-review bug class).
# Requires: local PG running, cretas_user/cretas_pass, cretas_r10_it_test DB.

spring.application.name=Cretas R10 IT
server.port=0

# ==========================================
# Database — real PostgreSQL for JSONB fidelity
# ==========================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/cretas_r10_it_test
spring.datasource.username=cretas_user
spring.datasource.password=cretas_pass

# Disable the second (SmartBI) datasource — not needed for reorder IT,
# and its default password is empty so boot would fail.
smartbi.postgres.enabled=false
python-smartbi.enabled=false
python-error-analysis.enabled=false
python-classifier.enabled=false
ai.multi-intent.llm-fallback-enabled=false
cretas.ai.disambiguation.enabled=false
cretas.ai.service.fallback-enabled=false

# ==========================================
# Hibernate — validate only; schema is managed externally
# ==========================================
# NOTE: The test DB cretas_r10_it_test is expected to already contain the
# 5 tables from r10-it-schema.sql. To (re)create them:
#   psql -U cretas_user -d cretas_r10_it_test -f src/test/resources/r10-it-schema.sql
#
# Hibernate is in "none" mode because @DataJpaTest's auto-config does not
# reliably honor ddl-auto=create-drop on a non-embedded DataSource, and
# letting Hibernate scan the full 2199-entity graph for auto-DDL pulls in
# every JSONB column type and fails on unrelated entities.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway off — schema managed externally
spring.flyway.enabled=false

# 2026-05-09: auto-init schema from classpath so tests don't require manual psql
# step. Idempotent because r10-it-schema.sql starts with DROP TABLE IF EXISTS.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:r10-it-schema.sql
spring.sql.init.continue-on-error=false
# Run schema init BEFORE Hibernate validates entities against existing tables.
spring.jpa.defer-datasource-initialization=false

# ==========================================
# Disable noisy subsystems irrelevant to this test
# ==========================================
spring.task.scheduling.pool.size=0
spring.main.lazy-initialization=true
logging.level.root=WARN
logging.level.com.cretas.aims=INFO
logging.level.org.hibernate.SQL=WARN

# Disable gRPC embedding (no server running in test)
grpc.client.embedding-service.enabled=false
embedding.service.enabled=false

# Disable Python BERT classifier
cretas.classifier.enabled=false

# Disable AI LLM calls
dashscope.api-key=disabled
cretas.ai.llm.enabled=false

# 人力成本率偏高 — 操作建议手册

diagnosis_code: labor_cost_ratio_high
trigger_metric: labor_cost_ratio
trigger_condition: "actual > range_high"
display_name: "人力成本率偏高"

severity_levels:
  moderate:
    condition: "actual - range_high <= 5"
    label: "中等偏高"
  severe:
    condition: "actual - range_high > 5"
    label: "严重偏高"

action_plans:
  - id: 1
    name: "排班优化"
    priority: "P0"
    actions:
      - "分析各时段客流量，识别闲时人力冗余（通常14:00-17:00是低谷）"
      - "推行弹性排班制，高峰时段增人、低谷时段减人"
      - "引入兼职/小时工覆盖周末和节假日高峰"
      - "对比各门店人效(营收/人数)，末位门店定向优化排班"
    expected_impact: "人力成本降低2-4个百分点"

  - id: 2
    name: "效率提升"
    priority: "P0"
    actions:
      - "梳理前厅后厨动线，减少无效走动"
      - "标准化操作流程(SOP)，缩短出餐时间"
      - "引入自助点餐/扫码点餐，减少前厅服务员需求"
      - "评估中央厨房/预制菜方案，减少门店后厨人数"
    expected_impact: "人均服务桌数提升20-30%"

  - id: 3
    name: "薪酬结构优化"
    priority: "P1"
    actions:
      - "建立绩效奖金制度（与翻台率/客单价/好评率挂钩）"
      - "评估固定薪酬 vs 底薪+提成模式的成本差异"
      - "对比同区域同品类竞品薪资水平，避免过高基本工资"
    expected_impact: "优化薪资结构，人力成本降低1-3%"

  - id: 4
    name: "自动化/数字化"
    priority: "P2"
    actions:
      - "评估智能收银系统替代人工收银可行性"
      - "考虑传菜机器人/送餐轨道(适用于火锅/快餐)"
      - "引入智能排班软件，基于历史数据自动生成排班表"
    expected_impact: "长期减少1-2名全职员工/门店"

# ── 结构化处方行动 (P3.7) ─────────────────────────
rx_actions:
  - id: LC-A01
    title: 重排低客流时段班次
    description: 分析14:00-17:00客流数据, 将该时段在岗人数从当前配置削减1-2人, 改为按需呼叫兼职覆盖突发需求.
    owner: 店长
    timeframe: 本周内
    priority: P0
    effort: low
    expected_impact: 人力成本 -2pp, 单月节省 ≈ ¥4-6K

  - id: LC-A02
    title: 引入兼职覆盖周末高峰
    description: 周末高峰期增加2-3名4小时兼职, 替换现有全职加班安排. 兼职时薪约 ¥25-35/h, 总成本比全职加班低40%.
    owner: 店长
    timeframe: 2 周
    priority: P0
    effort: medium
    expected_impact: 周末人力成本 -15%, 全职加班费减少

  - id: LC-A03
    title: 建立绩效奖金制度
    description: 将20%奖金与翻台率/好评率/客单价挂钩, 固定薪酬降低对应比例. 员工总收入不变, 但成本与业绩联动.
    owner: 运营经理
    timeframe: 4 周
    priority: P1
    effort: medium
    expected_impact: 薪酬弹性提升, 淡季人力成本自动下降1-2pp

  - id: LC-A04
    title: 引入自助点餐减少服务员需求
    description: 采用扫码点餐 + 自助呼叫系统, 减少传统点单服务员岗位. 设备采购约¥5-8K/套, 6个月可回本.
    owner: 运营经理
    timeframe: Q2
    priority: P2
    effort: high
    expected_impact: 前厅人员减少1名, 年度节省 ≈ ¥4-6万

sub_sector_notes:
  火锅:
    - "海底捞人力成本率约31%，属于高服务溢价模式——如果你不走高服务路线，不应对标海底捞"
    - "火锅服务相对简单(客户自涮)，应控制在25%以下"
    - "传菜机器人在火锅店效果好(固定路线+标准化)"
  快餐:
    - "快餐标准化程度高，人力成本应控制在22%以下"
    - "自助点餐机是最快见效的投入(通常3-6个月回本)"
    - "中央厨房配送可大幅减少门店厨师数量"
  西餐:
    - "高端西餐服务是核心体验，不宜过度削减前厅"
    - "重点优化后厨效率——酱汁/Stock批量制备、mise en place标准化"
  日料:
    - "师傅技艺是核心竞争力，不宜通过降薪节省"
    - "可在非核心岗位(传菜/清洁/备料)引入兼职"

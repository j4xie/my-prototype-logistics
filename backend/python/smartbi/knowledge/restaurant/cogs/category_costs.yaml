# 餐饮类目均价 (BOM 80% 三层学习的 Layer 1 默认值)
#
# 用途:
#   bom_resolver.py 在客户没有上传月度采购数据时, 用此文件作为初始 COGS 估算.
#   客户上传后, Layer A (CategoryPriceCalibrator) 会用真实数据自动校准, 写入
#   restaurant_category_price_calibrated 表覆盖此默认值.
#
# 数据来源:
#   - 中国饭店协会 2024 年度行业报告
#   - 海底捞/呷哺呷哺/九毛九 2024 年报
#   - 餐宝典 NCBD 2024 餐饮成本结构白皮书
#   - .claude/agent-team-outputs/2026-03-12_restaurant-industry-data-sources.md (33 份整理)
#
# 精度说明:
#   - 基于行业基准, 单店实际可能 ±15% 偏差
#   - 第一次校准 (3 个月) 后精度升到 ±10%
#   - 12 个月后精度收敛到 ±6-8% (Layer A 物理上限)

domain: restaurant
last_updated: 2026-04-08
expected_accuracy_pp: 15.0  # 初始精度 ±15 个百分点

categories:
  # ── 火锅 ─────────────────────────────────────────
  火锅:
    锅底:
      avg_price: 12.0
      unit: 元/锅
      range: [8, 18]
      source: 海底捞 2024 年报 + 呷哺呷哺 2024 年报
      notes: 牛油锅底成本明显高于清汤/番茄

    肉类涮品:
      avg_price: 28.0
      unit: 元/份
      range: [22, 42]
      source: 中国饭店协会 / 餐宝典
      notes: 牛羊肉为主, 不含和牛/雪花等高端品类

    海鲜涮品:
      avg_price: 35.0
      unit: 元/份
      range: [25, 50]
      notes: 虾滑/鱼丸/活鲜, 鱼类波动大

    叶菜涮品:
      avg_price: 8.0
      unit: 元/份
      range: [6, 12]
      notes: 包括 '叶菜组' = 油麦菜/茼蒿/菠菜/生菜/娃娃菜...

    菌菇涮品:
      avg_price: 10.0
      unit: 元/份
      range: [8, 15]
      notes: 金针菇/香菇/杏鲍菇/茶树菇/平菇...

    豆制品:
      avg_price: 6.0
      unit: 元/份
      range: [4, 9]
      notes: 豆腐皮/千页豆腐/腐竹/豆腐...

    主食:
      avg_price: 5.0
      unit: 元/份
      range: [3, 8]
      notes: 米饭/面条/年糕/土豆粉

    饮料:
      avg_price: 4.0
      unit: 元/份
      range: [2, 8]
      notes: 自助饮料/瓶装水/可乐/啤酒 (酒精类毛利不同)

  # ── 鱼类餐饮 (青花椒所属子行业) ─────────────────
  鱼类餐饮:

# 渠道平台抽佣率默认值
#
# 用途:
#   ChannelMarginCalculator 通过 DynamicConfigResolver 查找抽佣率,
#   优先级: 工厂级 DB 覆盖 → 子行业默认 → 全局默认.
#
# 数据来源:
#   - 美团商家学院 2024 商家服务费率说明
#   - 饿了么招商手册 2024
#   - 抖音生活服务商家政策 2024-2025
#   - 京东外卖商家政策 2025
#   - 微信小程序自营外卖费率
#
# 重要提示:
#   - 实际费率每家门店都不同 (品类/历史/谈判结果决定)
#   - 默认值仅作初始估算, 客户应在前端表单填实际费率
#   - 任何客户提出"这数不对"时, 立即让其填实际值, 不要狡辩

domain: restaurant
last_updated: 2026-04-08
disclaimer: |
  本文件提供的是行业默认抽佣率, 用于初始估算. 实际费率可能 ±5pp 浮动.
  客户应在前端 SmartBI 设置页 → "渠道费率配置" 填实际值, 系统会优先使用工厂级覆盖.

# ── 全局默认 (跨子行业通用) ──────────────────────
default_rates:
  堂食: 0.0
  自营外卖: 0.0
  外卖自提: 0.0  # 餐厅自配送
  美团外卖: 0.20
  饿了么: 0.20
  抖音外卖: 0.22
  抖音团购: 0.22
  京东外卖: 0.20
  微信小程序: 0.06
  企业团餐: 0.0
  外卖代运营: 0.25  # 第三方代运营抽成更高

# ── 子行业差异化费率 ─────────────────────────────
per_sub_sector:
  火锅:
    美团外卖: 0.18    # 火锅品类美团费率较低 (高客单+预订模式)
    抖音外卖: 0.20

  烧烤:
    美团外卖: 0.19
    抖音外卖: 0.21

  快餐:
    美团外卖: 0.22    # 快餐高频低客单, 平台费率更高
    饿了么: 0.22
    抖音外卖: 0.23

  奶茶:
    美团外卖: 0.21
    饿了么: 0.21
    抖音团购: 0.20

  咖啡:
    美团外卖: 0.21
    饿了么: 0.21

  鱼类餐饮:
    美团外卖: 0.18    # 与火锅类似, 高客单
    抖音外卖: 0.20

  西餐:
    美团外卖: 0.18
    抖音外卖: 0.18

  日料:
    美团外卖: 0.20

  牛肉面:
    美团外卖: 0.21
    饿了么: 0.21

  中式海鲜:
    美团外卖: 0.17    # 高客单 + 大单优惠

# ── 配送费 (额外成本, 与抽佣独立) ───────────────
default_delivery_fees:
  美团外卖: 3.5      # 元/单 (商家承担部分)
  饿了么: 3.5
  抖音外卖: 3.0
  京东外卖: 3.0
  微信小程序: 0      # 商家自配送
  自营外卖: 0
  堂食: 0

# ── 包装费 (商家成本, 部分可向消费者收取) ───────
default_packaging_costs:
  per_order: 1.5     # 元/单, 商家实际成本
  consumer_charge: 2.0  # 商家向消费者收取的打包费, 净收入
  net_packaging_cost: -0.5  # 商家实际净成本 (负数表示有微利)

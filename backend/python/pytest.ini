[pytest]
asyncio_mode = auto
timeout = 60
markers =
    integration: marks tests that require a live DB connection (deselect with -m 'not integration')
    api_endpoint(name): tags a test as covering a named migrated endpoint in smartbi_compat.api.* (see conftest.py KNOWN_ENDPOINTS); Phase 2B-final gate enforces >=3 tests per endpoint when CRETAS_TEST_ENDPOINT_GATE=1
